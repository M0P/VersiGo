# Docker Compose Test Stack
# Runs all quality checks inside isolated containers.
# Usage: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test

name: versigo

services:
  # Reuse the production images for dependencies
  test-db:
    image: docker.io/postgres:16.4-alpine
    environment:
      POSTGRES_DB: versigo_test
      POSTGRES_USER: versigo
      POSTGRES_PASSWORD: versigo_test
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    networks:
      - test-versigo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U versigo -d versigo_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-redis:
    image: docker.io/redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    networks:
      - test-versigo-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Test runner: executes all quality checks
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: build
    image: versigo-test:latest
    environment:
      DATABASE_URL: postgresql://versigo:versigo_test@test-db:5432/versigo_test
      REDIS_URL: redis://test-redis:6379
      NODE_ENV: test
      CI: "true"
    command: >
      sh -c "
        echo 'Database is ready.' &&
        echo 'Running Prisma migration check...' &&
        npx prisma migrate deploy &&
        echo 'Running lint...' &&
        pnpm run lint 2>&1 &&
        echo 'Running typecheck...' &&
        pnpm run typecheck 2>&1 &&
        echo 'Running tests...' &&
        pnpm run test 2>&1 &&
        echo 'Running i18n guard (hardcoded German UI texts)...' &&
        pnpm --filter @versigo/web run test:i18n 2>&1 &&
        echo 'All checks passed!'
      "
    networks:
      - test-versigo-internal
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy

networks:
  test-versigo-internal:
    driver: bridge

volumes:
  test-postgres-data:
