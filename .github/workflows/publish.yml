# Publish Docker Images
#
# Builds and pushes the VersiGo production images to Docker Hub.
# Triggers: version tag (v*) or manual workflow_dispatch.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  - Docker Hub user name
#   DOCKERHUB_TOKEN     - Docker Hub access token (read/write)
#
# The Docker Hub namespace is configured in the `dockerhub-namespace`
# environment variable below (e.g. `m000p`). Images are named
# `<namespace>/versigo-<service>` where <service> is one of
# api / worker / web / migration.
#
# Tag behavior:
# - Tag push `v*` -> images are pushed as `<version>` (tag without `v`) plus
#   `:latest`.
# - Manual `workflow_dispatch` -> images are pushed with a sha-based tag
#   `manual-<short-sha>` only; `:latest` is never overwritten and branch
#   names (which may contain '/') are never used as tags.

name: Publish Docker Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # Docker Hub namespace the images are published under, e.g. `m000p`.
  DOCKERHUB_NAMESPACE: m000p
  IMAGE_PREFIX: versigo

jobs:
  dockerhub:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            file: apps/api/Dockerfile
            target: ""
          - service: worker
            file: apps/worker/Dockerfile
            target: ""
          - service: web
            file: apps/web/Dockerfile
            target: ""
          - service: migration
            file: apps/api/Dockerfile
            target: migration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Version tag push (e.g. v1.2.3) -> publish <version> + latest.
            TAG="${GITHUB_REF_NAME#v}"
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          else
            # Manual workflow_dispatch: GITHUB_REF_NAME is a branch name
            # (never overwrite :latest with an unreleased build, and branch
            # names may contain '/' which is invalid in a Docker tag).
            TAG="manual-${GITHUB_SHA::8}"
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Ref: $GITHUB_REF_NAME -> Tag: $TAG"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          # BugFix-10 (#2): zstd ist schneller und komprimiert besser als gzip
          # (Docker Engine 24+ / Podman 5+, siehe README Voraussetzungen);
          # provenance/sbom werden deaktiviert (kleinere Manifeste, keine
          # attestations beim Docker-Hub-Push).
          compression: zstd
          provenance: false
          sbom: false
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.push_latest == 'true' && format('{0}/{1}-{2}:latest', env.DOCKERHUB_NAMESPACE, env.IMAGE_PREFIX, matrix.service) || '' }}
