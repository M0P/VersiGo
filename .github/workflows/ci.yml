name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: docker-compose.test.yml
  COMPOSE_PROJECT_NAME: versigo-ci

jobs:
  compose-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build test image
        run: docker compose build test

      - name: Run quality checks
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from test 2>&1 || {
            echo "=== Test container logs ==="
            docker compose logs test
            echo "=== Database logs ==="
            docker compose logs test-db
            docker compose down --volumes --remove-orphans
            exit 1
          }

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [compose-test]
    env:
      COMPOSE_FILE: docker-compose.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy environment file
        run: cp .env.example .env

      - name: Build production images
        run: docker compose build api web worker

      - name: Start services
        run: docker compose up -d db redis

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U versigo -d versigo -t 5 >/dev/null 2>&1; then
              echo "Database is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Database not ready"
              docker compose logs db
              exit 1
            fi
            sleep 2
          done

      - name: Wait for Redis
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Redis not ready"
              exit 1
            fi
            sleep 2
          done

      - name: Run migration
        run: docker compose run --rm migration

      - name: Start API
        run: docker compose up -d api

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health >/dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "API not healthy"
              docker compose logs api
              exit 1
            fi
            sleep 2
          done

      - name: Wait for API readiness
        run: |
          for i in $(seq 1 15); do
            status=$(curl -sf http://localhost:3001/ready | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            if [ "$status" = "ready" ]; then
              echo "API is ready"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "API not ready"
              curl -s http://localhost:3001/ready || true
              docker compose logs api
              exit 1
            fi
            sleep 2
          done

      - name: Start Web
        run: docker compose up -d web

      - name: Wait for Web
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ >/dev/null 2>&1; then
              echo "Web is available"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Web not available"
              docker compose logs web
              exit 1
            fi
            sleep 2
          done

      - name: Smoke tests
        run: |
          echo "=== Smoke Tests ==="

          echo "1. API health endpoint"
          HEALTH=$(curl -sf http://localhost:3001/health)
          echo "Response: $HEALTH"
          echo "$HEALTH" | grep -q '"ok"' || { echo "FAILED"; exit 1; }
          echo "PASS"

          echo "2. API readiness endpoint"
          READY=$(curl -sf http://localhost:3001/ready)
          echo "Response: $READY"
          echo "$READY" | grep -q '"ready"' || { echo "FAILED"; exit 1; }
          echo "PASS"

          echo "3. Web availability (accepts 2xx/3xx redirects)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "PASS"
          else
            echo "FAILED"
            exit 1
          fi

          echo "4. Database-backed request"
          DB_STATUS=$(echo "$READY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('database',''))")
          echo "Database status: $DB_STATUS"
          [ "$DB_STATUS" = "up" ] || { echo "FAILED"; exit 1; }
          echo "PASS"

          echo "=== All smoke tests passed ==="

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

  # Build-Metrik-Job (INFORMATIV, NICHT BLOCKIEREND):
  # misst Build-Dauer und Image-Groessen der Produktionsimages. Ein Fehler
  # in diesem Job faellt den Workflow NICHT (continue-on-error). Der
  # maßgebliche Release-Gate ist der Smoke-Test oben.
  build-metrics:
    runs-on: ubuntu-latest
    needs: [compose-test]
    continue-on-error: true
    env:
      COMPOSE_FILE: docker-compose.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy environment file
        run: cp .env.example .env

      - name: Build production images (timed)
        id: build
        run: |
          START=$(date +%s)
          docker compose build api web worker
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> "$GITHUB_OUTPUT"
          echo "Build finished in $((ELAPSED / 60))m $((ELAPSED % 60))s"

      - name: Measure image sizes
        id: measure
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | grep -E 'versigo-(api|worker|web)' | sort -u | tee /tmp/versigo-images.txt
          echo "images<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/versigo-images.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Report metrics (job summary)
        run: |
          {
            echo "## Build-Metriken (informativ)"
            echo ""
            echo "| Metrik | Wert |"
            echo "|--------|------|"
            echo "| Build-Dauer (Produktionsimages) | $(( ${{ steps.build.outputs.elapsed_seconds }} / 60 ))m $(( ${{ steps.build.outputs.elapsed_seconds }} % 60 ))s |"
            echo ""
            echo "| Image | Groesse |"
            echo "|-------|---------|"
            while IFS=$'\t' read -r img size; do
              echo "| \`$img\` | $size |"
            done <<< "${{ steps.measure.outputs.images }}"
            echo ""
            echo "_Hinweis: Dieser Job ist nicht blockierend. Zielwerte AP-20: API/Worker < 1 GB, Web < 300 MB, Build ≤ 15 Min._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
