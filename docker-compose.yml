# VersiGo – production/development stack
name: versigo

services:
  # ============================================================
  # Database
  # ============================================================
  db:
    image: docker.io/postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - versigo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # Redis (Queue / Cache)
  # ============================================================
  redis:
    image: docker.io/redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    networks:
      - versigo-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Database Migration (one-shot convenience)
  # ============================================================
  migration:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    image: versigo-api:latest
    entrypoint: []
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      NODE_ENV: ${NODE_ENV:-production}
    command: ["node", "-e", "\
      const { execSync } = require('child_process'); \
      process.stdout.write('Database is ready.\\n'); \
      process.stdout.write('Running migrations...\\n'); \
      execSync('npx prisma migrate deploy', { stdio: 'inherit' }); \
      process.stdout.write('Migrations complete.\\n'); \
      process.exit(0);"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - versigo-internal

  # ============================================================
  # API (NestJS Backend)
  # ============================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: versigo-api:latest
    restart: unless-stopped
    environment:
      APP_PORT: "3001"
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY must be set}
      STORAGE_ENABLED: "${STORAGE_ENABLED:-false}"
      DOCUMENTS_STORAGE_PATH: ${DOCUMENTS_STORAGE_PATH:-/data/uploads}
      # AP-16: Only set to true behind a trusted reverse proxy
      # (otherwise req.ip falls back to the proxy IP behind the proxy and the
      # per-IP rate limits would lock out all clients globally).
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      # AP-20: Secure flag of the session cookie. Default: true in production
      # (derived from NODE_ENV). Only set explicitly when the API is served
      # deliberately over plain HTTP (TLS-terminating reverse proxy or
      # controlled internal installation).
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      # AP-16: Allowed browser origins for CORS (comma-separated list).
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      # Auth flags are only passed through when set; the default
      # resolution (local auth active in dev mode) is done by the app.
      LOCAL_AUTH_ENABLED: "${LOCAL_AUTH_ENABLED:-}"
      LOCAL_AUTH_MAX_ATTEMPTS: "${LOCAL_AUTH_MAX_ATTEMPTS:-5}"
      LOCAL_AUTH_RATE_LIMIT_WINDOW_MS: "${LOCAL_AUTH_RATE_LIMIT_WINDOW_MS:-900000}"
      # Initial local administrator (local development only)
      LOCAL_ADMIN_USERNAME: "${LOCAL_ADMIN_USERNAME:-}"
      LOCAL_ADMIN_PASSWORD: "${LOCAL_ADMIN_PASSWORD:-}"
      OIDC_ENABLED: "${OIDC_ENABLED:-}"
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-}
      AI_ENABLED: "${AI_ENABLED:-false}"
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      PAPERLESS_ENABLED: "${PAPERLESS_ENABLED:-false}"
      PAPERLESS_URL: ${PAPERLESS_URL:-}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN:-}
      # BugFix-06 (Teil 2): SSRF/TLS relaxation for the connectivity test,
      # OIDC discovery, AI providers and Paperless-ngx. Opt-in, off by default
      # (strict SSRF protection; cloud metadata 169.254.169.254 stays blocked).
      CONNECTIVITY_ALLOW_PRIVATE_ENDPOINTS: "${CONNECTIVITY_ALLOW_PRIVATE_ENDPOINTS:-false}"
      CONNECTIVITY_ALLOW_SELF_SIGNED: "${CONNECTIVITY_ALLOW_SELF_SIGNED:-false}"
    ports:
      - "${APP_PORT:-3001}:3001"
    volumes:
      - uploads-data:/data/uploads
    networks:
      - versigo-internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  # Worker (BullMQ Background Jobs)
  # ============================================================
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: versigo-worker:latest
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY must be set}
      STORAGE_ENABLED: "${STORAGE_ENABLED:-false}"
      DOCUMENTS_STORAGE_PATH: ${DOCUMENTS_STORAGE_PATH:-/data/uploads}
      # Auth flags are passed through consistently to the API (the default
      # resolution is done by the app).
      LOCAL_AUTH_ENABLED: "${LOCAL_AUTH_ENABLED:-}"
      LOCAL_AUTH_MAX_ATTEMPTS: "${LOCAL_AUTH_MAX_ATTEMPTS:-5}"
      LOCAL_AUTH_RATE_LIMIT_WINDOW_MS: "${LOCAL_AUTH_RATE_LIMIT_WINDOW_MS:-900000}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      OIDC_ENABLED: "${OIDC_ENABLED:-}"
      AI_ENABLED: "${AI_ENABLED:-false}"
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      # BugFix-06 (Teil 2): Same connectivity relaxation flags as the API
      # (AI providers run in the worker too); opt-in, off by default.
      CONNECTIVITY_ALLOW_PRIVATE_ENDPOINTS: "${CONNECTIVITY_ALLOW_PRIVATE_ENDPOINTS:-false}"
      CONNECTIVITY_ALLOW_SELF_SIGNED: "${CONNECTIVITY_ALLOW_SELF_SIGNED:-false}"
      # AP-19: Worker health (liveness port + heartbeat interval/timeout)
      WORKER_HEALTH_PORT: "${WORKER_HEALTH_PORT:-3100}"
      WORKER_HEARTBEAT_INTERVAL_MS: "${WORKER_HEARTBEAT_INTERVAL_MS:-15000}"
      WORKER_HEARTBEAT_TIMEOUT_MS: "${WORKER_HEARTBEAT_TIMEOUT_MS:-45000}"
    # No host port mapping: the worker liveness port (3100) is deliberately
    # NOT published to the host (only web 3000 + API 3001 are public ports,
    # see docs/07-security-privacy.md). The Compose healthcheck and the smoke
    # test check it inside the container.
    volumes:
      - uploads-data:/data/uploads
    networks:
      - versigo-internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Port aus WORKER_HEALTH_PORT lesen (Default 3100), damit der
      # Healthcheck dem konfigurierten Liveness-Port folgt.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:' + (process.env.WORKER_HEALTH_PORT || '3100') + '/health', r => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  # Web (Next.js Frontend)
  # ============================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: versigo-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      # API base URL for the browser - injected at container startup via entrypoint
      # This allows fully dynamic port configuration without rebuilding the web image
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - versigo-internal
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => { process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  # Storage (MinIO) – optional, via profile "storage"
  # ============================================================
  storage:
    profiles: ["storage"]
    image: docker.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio-data:/data
    networks:
      - versigo-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  versigo-internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  uploads-data:
