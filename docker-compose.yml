services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insura}
      POSTGRES_USER: ${POSTGRES_USER:-insura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - insura-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    networks:
      - insura-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    profiles: ["storage"]
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change-me}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-change-me}
    volumes:
      - minio-data:/data
    networks:
      - insura-internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - POSTGRES_DB=${POSTGRES_DB:-insura}
      - POSTGRES_USER=${POSTGRES_USER:-insura}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
      - DATABASE_URL=${DATABASE_URL:-postgresql://insura:change-me@db:5432/insura}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - STORAGE_ENABLED=${STORAGE_ENABLED:-false}
      - DOCUMENTS_STORAGE_PATH=${DOCUMENTS_STORAGE_PATH:-/app/uploads}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://storage:9000}
      - S3_BUCKET=${S3_BUCKET:-insura}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-change-me}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-change-me}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-change-me}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-change-me-change-me}
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-https://issuer.example.com}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-insura}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-change-me}
      - OIDC_CALLBACK_URL=${OIDC_CALLBACK_URL:-http://localhost:3001/auth/callback}
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - AI_OLLAMA_BASE_URL=${AI_OLLAMA_BASE_URL:-http://localhost:11434}
      - AI_OLLAMA_MODEL=${AI_OLLAMA_MODEL:-llama3}
      - AI_OPENAI_COMPAT_BASE_URL=${AI_OPENAI_COMPAT_BASE_URL:-https://api.example.com/v1}
      - AI_OPENAI_COMPAT_API_KEY=${AI_OPENAI_COMPAT_API_KEY:-change-me}
      - AI_OPENAI_COMPAT_MODEL=${AI_OPENAI_COMPAT_MODEL:-gpt-4o-mini}
      - AI_EXTRACTION_TIMEOUT_MS=${AI_EXTRACTION_TIMEOUT_MS:-60000}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-3}
      - PAPERLESS_ENABLED=${PAPERLESS_ENABLED:-false}
      - PAPERLESS_BASE_URL=${PAPERLESS_BASE_URL:-https://paperless.example.com}
      - PAPERLESS_API_TOKEN=${PAPERLESS_API_TOKEN:-change-me}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY:-change-me-64-char-hex-generate-with-openssl-rand-hex-32-cmd}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-generate-with-openssl-rand-hex-32-cmd}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - insura-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "3001:3001"
    command: sh -c "SERVICE=api /app/start.sh"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - APP_PORT=${APP_PORT:-3000}
      - WEB_PORT=${WEB_PORT:-3000}
      - NEXT_PUBLIC_API_URL=http://api:3001
      - NEXT_PUBLIC_OIDC_ENABLED=${NEXT_PUBLIC_OIDC_ENABLED:-false}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - insura-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "3000:3000"
    command: sh -c "SERVICE=web /app/start.sh"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - POSTGRES_DB=${POSTGRES_DB:-insura}
      - POSTGRES_USER=${POSTGRES_USER:-insura}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
      - DATABASE_URL=${DATABASE_URL:-postgresql://insura:change-me@db:5432/insura}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY:-change-me-64-char-hex-generate-with-openssl-rand-hex-32-cmd}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-generate-with-openssl-rand-hex-32-cmd}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - insura-internal
    command: sh -c "SERVICE=worker /app/start.sh"

networks:
  insura-internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
